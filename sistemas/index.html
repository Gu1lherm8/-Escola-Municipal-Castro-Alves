<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso aos Sistemas Internos | Escola Municipal Castro Alves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06120b;
      --card-bg: rgba(11, 28, 19, 0.82);
      --accent: #f9c31f;
      --accent-glow: rgba(249, 195, 31, 0.4);
      --emerald: #00a878;
      --emerald-glow: rgba(0, 168, 120, 0.45);
      --text: #f4f9f4;
      --muted: #a3c2b0;
      --danger: #f87171;
      --danger-bg: rgba(239, 68, 68, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 15% 15%, rgba(0, 168, 120, 0.22) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(249, 195, 31, 0.14) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(9, 24, 16, 0.9) 0px, transparent 100%);
    }

    /* ===== 21st.dev Style: Border Beam Card Container ===== */
    .card-beam-wrapper {
      position: relative;
      width: 100%;
      max-width: 430px;
      border-radius: 26px;
      padding: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.75);
      animation: appear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* O Feixe de Luz Giratório (Border Beam) */
    .card-beam-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 80deg,
        var(--accent) 120deg,
        var(--emerald) 160deg,
        transparent 200deg,
        transparent 360deg
      );
      animation: rotateBeam 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes rotateBeam {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Card Interno Real */
    .login-container {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 2.5rem 2.2rem;
      position: relative;
      z-index: 2;
    }

    /* Identidade da Escola */
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo-glow {
      position: relative;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .brand-logo-glow::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--emerald));
      filter: blur(12px);
      opacity: 0.5;
      z-index: 0;
    }

    .brand-logo {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(249, 195, 31, 0.5);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(0, 168, 120, 0.16);
      border: 1px solid rgba(0, 168, 120, 0.4);
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.7rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    /* Formulário */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      background: rgba(6, 16, 11, 0.85);
      border: 1.5px solid rgba(181, 201, 154, 0.2);
      border-radius: 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.82rem 1rem 0.82rem 2.75rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 195, 31, 0.2);
      background: rgba(10, 26, 18, 0.95);
    }

    .form-input:focus + .input-icon {
      color: var(--accent);
    }

    .form-input::placeholder {
      color: rgba(163, 194, 176, 0.4);
    }

    /* Botão com Efeito Glow Inspirado no 21st.dev */
    .btn-submit {
      width: 100%;
      position: relative;
      background: linear-gradient(135deg, var(--accent), #e6ad10);
      color: #0d2318;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      padding: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1.8rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px -5px rgba(249, 195, 31, 0.5);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #ffd752, var(--accent));
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(249, 195, 31, 0.7);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    /* Mensagem de Erro */
    .alert-error {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--danger-bg);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 10px;
      color: var(--danger);
      font-size: 0.84rem;
      padding: 0.75rem 1rem;
      margin-top: 1.2rem;
      animation: shake 0.35s ease;
    }

    .alert-error.visible {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Rodapé */
    .footer-link {
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(163, 194, 176, 0.6);
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .footer-link a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-beam-wrapper::before, .card-beam-wrapper, .btn-submit, .alert-error {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Wrapper do Border Beam da 21st.dev -->
  <div class="card-beam-wrapper">
    <div class="login-container">
      <div class="brand-header">
        <div class="brand-logo-glow">
          <div class="brand-logo">
            <img src="/logo.png" alt="Logotipo Oficial Escola Castro Alves" onerror="this.style.display='none'">
          </div>
        </div>
        <div>
          <span class="brand-tag">Área Restrita</span>
        </div>
        <h1 class="brand-title">Sistemas Escolares</h1>
        <p class="brand-subtitle">Escola Municipal Castro Alves · Planaltina-GO</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="user">Usuário</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="user" class="form-input" placeholder="Digite seu usuário" required autocomplete="username" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pass">Senha</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="pass" class="form-input" placeholder="Digite sua senha" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span>Acessar Painel</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>

        <div id="errorBox" class="alert-error" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Usuário ou senha incorretos. Tente novamente.</span>
        </div>
      </form>

      <div class="footer-link">
        <a href="/">← Voltar ao site público</a>
      </div>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('castro_alves_auth') === 'true') {
      window.location.replace('/sistemas/hub.html');
    }

    const CREDENTIALS = {
      user: 'admin',
      pass: 'castro2026'
    };

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      const err = document.getElementById('errorBox');
      const btn = document.getElementById('submitBtn');

      err.classList.remove('visible');

      if (u === CREDENTIALS.user && p === CREDENTIALS.pass) {
        btn.disabled = true;
        btn.innerHTML = '<span>Verificando...</span>';
        
        sessionStorage.setItem('castro_alves_auth', 'true');
        localStorage.setItem('sigea_auth', 'ok');
        
        setTimeout(() => {
          window.location.replace('/sistemas/hub.html');
        }, 400);
      } else {
        err.classList.add('visible');
        document.getElementById('pass').value = '';
        document.getElementById('pass').focus();
      }
    }
  </script>
</body>
</html>
