<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Servidor - Escola Castro Alves</title>
  <style>
    :root { --verde: #0d2318; --dourado: #f9c31f; --branco: #ffffff; --fundo: #f4f6f5; }
    body { font-family: 'Inter', sans-serif; background: var(--fundo); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .caixa { background: var(--branco); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
    
    /* Shader Animado */
    @keyframes animatedGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero-header {
      text-align: center; margin-bottom: 40px; padding: 50px 20px; 
      border-radius: 16px; color: white; position: relative; overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      background: linear-gradient(-45deg, #0d2318, #1a3d28, #0a1f14, #123321);
      background-size: 400% 400%;
      animation: animatedGradient 12s ease infinite;
    }

    .btn-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
    .btn-cat { background: #f8f9fa; border: 2px solid #e0e0e0; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; color: var(--verde); cursor: pointer; transition: 0.2s; }
    .btn-cat:hover { border-color: var(--dourado); background: #fffdf5; }
    .btn-cat.active { background: var(--verde); color: var(--dourado); border-color: var(--verde); }
    
    .iframe-container { display: none; width: 100%; height: 1100px; }
    .iframe-container.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
    
    @media (max-width: 768px) {
      .btn-container { grid-template-columns: 1fr; }
      .caixa { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="caixa">
    <div class="hero-header">
      <!-- Background Glow -->
      <div style="position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle, rgba(249,195,31,0.15) 0%, transparent 60%); pointer-events:none;"></div>
      
      <!-- Trust Badge -->
      <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); padding:6px 16px; border-radius:50px; font-size:14px; font-weight:600; color:#f9c31f; margin-bottom:24px; backdrop-filter:blur(4px);">
        <span>🚀</span> <span>Acesso Exclusivo para Servidores</span> <span>✨</span>
      </div>
      
      <!-- Headline -->
      <h1 style="font-size:clamp(28px, 5vw, 42px); font-weight:900; line-height:1.2; margin:0 0 16px 0; color:#ffffff;">
        Portal do <span style="color:#f9c31f;">Servidor</span><br/>
        <span style="font-size:clamp(20px, 3vw, 26px); opacity:0.9;">Escola Municipal Castro Alves</span>
      </h1>
      
      <!-- Subtitle -->
      <p style="font-size:16px; color:#b5c99a; max-width:500px; margin:0 auto; line-height:1.6;">
        Selecione a sua categoria abaixo para acessar o seu formulário de cadastro administrativo com segurança e rapidez.
      </p>
    </div>

    <!-- Botões de Seleção -->
    <div class="btn-container">
      <button class="btn-cat" onclick="mostrarForm('voluntario', this)">🤝 Social Voluntário</button>
      <button class="btn-cat" onclick="mostrarForm('estagiarios', this)">🎓 Estagiários</button>
      <button class="btn-cat" onclick="mostrarForm('docentes', this)">📚 Docentes / Administrativos</button>
    </div>

    <!-- Área onde os formulários aparecem -->
    <div id="form-area">
      <!-- Mensagem inicial -->
      <div id="msg-inicial" style="text-align:center; padding: 40px; color: #888; border: 2px dashed #ccc; border-radius: 8px;">
        👆 Clique em um dos botões acima para carregar o seu formulário.
      </div>

      <!-- Iframes do Google Forms -->
      <div id="form-voluntario" class="iframe-container">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfUBf9H_wSe4qGHwHwOS39hoWxx0Wgbr3SYw3qMFpsGPLD8AQ/viewform?embedded=true">Carregando…</iframe>
      </div>

      <div id="form-estagiarios" class="iframe-container">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeA5cOkkKYQpDAaN2PktBnD9POsV59N7vtxHBWpAUGGHmW0sA/viewform?embedded=true">Carregando…</iframe>
      </div>
      
      <!-- Formulário unificado para Docentes e Administrativos -->
      <div id="form-docentes" class="iframe-container">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfF-5Jh6xVSDpaXVOExSqB-6ki0TDElRNyQ3xPACTkXO7z1ag/viewform?embedded=true">Carregando…</iframe>
      </div>
    </div>

  </div>

  <script>
    function mostrarForm(idForm, btnElement) {
      // Esconder a mensagem inicial
      document.getElementById('msg-inicial').style.display = 'none';

      // Esconder todos os iframes
      document.querySelectorAll('.iframe-container').forEach(el => el.classList.remove('active'));
      
      // Remover a classe 'active' de todos os botões
      document.querySelectorAll('.btn-cat').forEach(el => el.classList.remove('active'));
      
      // Mostrar o iframe escolhido
      document.getElementById('form-' + idForm).classList.add('active');
      
      // Marcar o botão clicado como verde/dourado
      btnElement.classList.add('active');
    }
  </script>
</body>
</html>
