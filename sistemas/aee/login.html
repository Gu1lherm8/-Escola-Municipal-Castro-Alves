<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Saída Antecipada AEE — Escola Municipal Castro Alves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: #030a1c;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; position: relative; overflow: hidden;
  }

  /* Efeito de brilho de fundo */
  body::before {
    content: ''; position: fixed;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,51,160,0.25), transparent 70%);
    top: -150px; right: -150px; pointer-events: none;
  }
  body::after {
    content: ''; position: fixed;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,130,0,0.08), transparent 70%);
    bottom: -100px; left: -100px; pointer-events: none;
  }

  .login-card {
    background: rgba(0, 30, 80, 0.7);
    border: 1px solid rgba(255, 130, 0, 0.3);
    border-radius: 20px; padding: 2.5rem 2.2rem;
    width: 100%; max-width: 400px;
    backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    position: relative; z-index: 1;
    animation: fadeUp 0.45s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-logo-row {
    display: flex; justify-content: center; align-items: center;
    gap: 14px; margin-bottom: 1.6rem;
  }
  .login-logo-img {
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid #FF8200; background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; box-shadow: 0 4px 14px rgba(245,192,48,0.25);
  }
  .login-logo-img img { width: 100%; height: 100%; object-fit: contain; }

  .login-title-block { text-align: center; margin-bottom: 2rem; }
  .login-title-block h1 {
    font-size: 1.8rem; font-weight: 900; color: #fff;
    line-height: 1;
  }
  .login-title-block .sigea-system {
    font-size: 0.72rem; color: #FF8200; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    margin-top: 4px; margin-bottom: 6px;
  }
  .login-title-block .school-name {
    font-size: 0.85rem; color: rgba(255,255,255,0.5);
  }

  .form-group { margin-bottom: 1.1rem; }
  .form-group label {
    display: block; font-size: 0.78rem; font-weight: 600;
    color: #FF8200; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 0.4rem;
  }
  .input-wrap { position: relative; }
  .input-wrap svg {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); color: rgba(255,255,255,0.3);
    pointer-events: none;
  }
  .form-control {
    width: 100%;
    background: rgba(0, 15, 50, 0.7);
    border: 1px solid rgba(0, 51, 160, 0.35);
    border-radius: 10px; color: #fff; font-family: inherit;
    font-size: 0.95rem; padding: 0.72rem 0.9rem 0.72rem 2.6rem;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-control:focus {
    border-color: #0033A0;
    box-shadow: 0 0 0 3px rgba(0,51,160,0.2);
  }
  .form-control::placeholder { color: rgba(255,255,255,0.25); }

  .btn-login {
    width: 100%; padding: 0.9rem;
    background: linear-gradient(135deg, #0033A0, #0048d9);
    border: none; border-radius: 12px; color: #fff;
    font-family: inherit; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 1.5rem;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 18px rgba(46,168,79,0.4);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,51,160,0.6); }
  .btn-login:active { transform: translateY(0); }

  .error-msg {
    display: none;
    background: rgba(200,30,30,0.18);
    border: 1px solid rgba(220,60,60,0.4);
    border-radius: 8px; padding: 0.65rem 0.9rem;
    font-size: 0.83rem; color: #ff8787; margin-top: 1rem;
    text-align: center;
    animation: shake 0.35s ease;
  }
  .error-msg.show { display: block; }
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    25%    { transform: translateX(-6px); }
    75%    { transform: translateX(6px); }
  }

  .footer-note {
    text-align: center; margin-top: 2rem;
    font-size: 0.72rem; color: rgba(255,255,255,0.15);
  }
  </style>
</head>
<body>
<div class="login-card">
  <!-- Logos -->
  <div class="login-logo-row">
    <div class="login-logo-img">
      <img src="logo oficial da escola.png" onerror="this.style.display='none'" alt="Escola">
    </div>
  </div>

  <!-- Título -->
  <div class="login-title-block">
    <h1>Saída Antecipada</h1>
    <div class="sigea-system">AEE — Atendimento Educacional Especializado</div>
    <div class="school-name">Escola Municipal Castro Alves</div>
  </div>

  <!-- Formulário -->
  <div class="form-group">
    <label for="username">Usuário</label>
    <div class="input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" autocomplete="username">
    </div>
  </div>

  <div class="form-group">
    <label for="password">Senha</label>
    <div class="input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="password" class="form-control" placeholder="Digite sua senha" autocomplete="current-password">
    </div>
  </div>

  <button class="btn-login" id="btn-login" onclick="login()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    Acessar o Sistema
  </button>

  <div class="error-msg" id="error-box">⚠️ Usuário ou senha incorretos.</div>

  <p class="footer-note">Saída Antecipada AEE v1.0 · 2026 · Castro Alves</p>
</div>

<script>
  if (localStorage.getItem('sigea_auth') === 'ok') {
    window.location.href = 'index.html';
  }

  const CREDS = { user: 'admin', pass: 'castro2026' };

  function login() {
    const u   = document.getElementById('username').value.trim();
    const p   = document.getElementById('password').value;
    const err = document.getElementById('error-box');
    const btn = document.getElementById('btn-login');
    err.classList.remove('show');

    if (u === CREDS.user && p === CREDS.pass) {
      btn.disabled = true;
      btn.innerHTML = '⏳ Entrando...';
      localStorage.setItem('sigea_auth', 'ok');
      setTimeout(() => window.location.href = 'index.html', 600);
    } else {
      err.classList.add('show');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
